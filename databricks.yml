bundle:
  name: once-upon-a-runtime

variables:
  app_prefix:
    description: Globally unique lowercase prefix within the workspace
    default: once-upon-a-runtime
  redis_secret_scope:
    description: Environment-specific Databricks secret scope for Redis connection identity
    default: once-upon-runtime-dev
  u2m_database_secret_scope:
    description: Backend-only scope containing the PostgreSQL URL
    default: once-upon-runtime-u2m-db-dev
  u2m_shared_secret_scope:
    description: Scope containing only the identity-signing secret shared by both Apps
    default: once-upon-runtime-u2m-shared-dev

resources:
  apps:
    unified_app:
      name: ${var.app_prefix}-unified
      description: React and FastAPI in one Databricks App runtime
      source_code_path: ./scenarios/unified
      permissions:
        - level: CAN_USE
          group_name: users

    split_backend:
      name: ${var.app_prefix}-api
      description: Split FastAPI backend
      source_code_path: ./scenarios/split/backend
      resources:
        - name: redis-host
          description: Azure Managed Redis TLS hostname
          secret:
            scope: ${var.redis_secret_scope}
            key: redis-host
            permission: READ
        - name: redis-tenant-id
          description: Microsoft Entra tenant for Redis workload identity
          secret:
            scope: ${var.redis_secret_scope}
            key: redis-tenant-id
            permission: READ
        - name: redis-client-id
          description: Microsoft Entra application client ID authorized in Redis
          secret:
            scope: ${var.redis_secret_scope}
            key: redis-client-id
            permission: READ
        - name: redis-client-secret
          description: Microsoft Entra client credential for Redis
          secret:
            scope: ${var.redis_secret_scope}
            key: redis-client-secret
            permission: READ

    split_frontend:
      name: ${var.app_prefix}-web
      description: Split React frontend and same-origin BFF proxy
      source_code_path: ./scenarios/split/frontend
      resources:
        - name: backend-app
          description: FastAPI target used by the frontend proxy
          app:
            name: ${resources.apps.split_backend.name}
            permission: CAN_USE
      permissions:
        - level: CAN_USE
          group_name: users

    u2m_backend:
      name: ${var.app_prefix}-u2m-api
      description: Internal FastAPI profile API with atomic PostgreSQL upsert
      source_code_path: ./scenarios/u2m-postgres/backend
      resources:
        - name: u2m-database-url
          description: SQLAlchemy PostgreSQL connection URL
          secret:
            scope: ${var.u2m_database_secret_scope}
            key: database-url
            permission: READ
        - name: u2m-identity-hmac
          description: Defense-in-depth key for signing forwarded user context
          secret:
            scope: ${var.u2m_shared_secret_scope}
            key: identity-hmac-secret
            permission: READ

    u2m_frontend:
      name: ${var.app_prefix}-u2m-web
      description: React and Node BFF using Databricks SSO and App-to-App OAuth
      source_code_path: ./scenarios/u2m-postgres/frontend
      resources:
        - name: u2m-backend-app
          description: Backend App discoverable by the frontend service principal
          app:
            name: ${resources.apps.u2m_backend.name}
            permission: CAN_USE
        - name: u2m-identity-hmac
          description: Defense-in-depth key for signing forwarded user context
          secret:
            scope: ${var.u2m_shared_secret_scope}
            key: identity-hmac-secret
            permission: READ
      permissions:
        - level: CAN_USE
          group_name: users

targets:
  dev:
    mode: development
    default: true
    variables:
      # Override with BUNDLE_VAR_app_prefix for parallel developer deployments.
      app_prefix: runtime-dev
      redis_secret_scope: once-upon-runtime-dev
      u2m_database_secret_scope: once-upon-runtime-u2m-db-dev
      u2m_shared_secret_scope: once-upon-runtime-u2m-shared-dev

  prod:
    mode: production
    variables:
      app_prefix: once-upon-a-runtime
      redis_secret_scope: once-upon-runtime-prod
      u2m_database_secret_scope: once-upon-runtime-u2m-db-prod
      u2m_shared_secret_scope: once-upon-runtime-u2m-shared-prod
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
